<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    style.css
</head>
<body>

    <div class="container">

        <h1>Guess The Number</h1>

        <p>
            Guess a number between 1 and 100
        </p>

        <input
            type="number"
            id="guess-input"
            placeholder="Enter your guess"
        >

        <button id="guess-btn">
            Guess
        </button>

        <p id="message">
            Good Luck!
        </p>

    </div>
    <style src="numberGame.css"></style>
<script src="numberGame.js"></script>
    script.jsscript
</body>
</html>
