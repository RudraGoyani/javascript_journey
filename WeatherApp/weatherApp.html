<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
   <link rel="stylesheet" href="weatherApp.css">
</head>
<body>

    <div class="container">

        <h1>🌤 Weather App</h1>

        <div class="search">

            <input
                type="text"
                id="city-input"
                placeholder="Enter city"
            >

            <button id="search-btn">
                Search
            </button>

        </div>

        <div id="weather-card">

            <h2 id="city-name">
                City
            </h2>

            <p id="temperature">
                Temperature
            </p>

            <p id="condition">
                Condition
            </p>

        </div>

    </div>

    <script src="weatherApp.js"></script>
</body>
</html>
